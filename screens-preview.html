<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screens Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .screens-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .screen-wrapper {
            text-align: center;
        }

        .screen-label {
            color: #3ab0d1;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .phone-frame {
            width: 300px;
            height: 650px;
            background: #ffffff;
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
        }

        /* ===== LAUNCH SCREEN ===== */
        .launch-screen {
            padding: 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            margin-top: 80px;
        }

        .launch-logo {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .launch-logo-text {
            font-size: 28px;
            color: #3ab0d1;
            font-weight: bold;
            letter-spacing: 7px;
            transform: translateY(-50px);
        }

        .title-container {
            text-align: left;
        }

        .launch-buttons {
            margin-top: auto;
            margin-bottom: 60px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            padding: 25px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: 40px;
        }

        /* ===== SIGNUP SCREEN ===== */
        .signup-screen {
            padding: 25px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: 40px;
        }

        /* ===== SHARED STYLES ===== */
        .title {
            font-size: 26px;
            font-weight: bold;
            color: #000;
            margin-bottom: 3px;
            text-align: left;
        }

        .subtitle {
            font-size: 14px;
            color: #555555;
            text-align: left;
        }

        .form-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #000;
            margin-bottom: 6px;
            padding-left: 3px;
        }

        .input-group input {
            width: 100%;
            border: 0.5px solid #898989;
            border-radius: 10px;
            padding: 8px 10px;
            height: 32px;
            font-size: 13px;
            color: #888;
            background: #fff;
            outline: none;
        }

        .primary-button {
            width: 100%;
            padding: 11px;
            background: #3ab0d1;
            border: 1px solid #32a0be;
            border-radius: 100px;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }

        .white-button {
            width: 100%;
            padding: 11px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 100px;
            color: #3ab0d1;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }

        .button-container {
            margin-top: 30px;
        }

        .link-container {
            margin-top: 15px;
            text-align: right;
        }

        .link {
            color: #3ab0d1;
            font-size: 12px;
            cursor: pointer;
        }

        .or-container {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .or-line {
            flex: 1;
            height: 1px;
            background: #d0d0d0;
        }

        .or-text {
            font-size: 13px;
            color: #888888;
        }

        .or-text-center {
            font-size: 13px;
            color: #555;
            text-align: left;
            margin-top: 25px;
        }

        .google-button {
            margin-top: 18px;
            width: 100%;
            padding: 11px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        .google-text {
            font-size: 13px;
            color: #333333;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>UCI Neuroscreen - Owlet App Screens</h1>
    
    <div class="screens-container">
        <!-- LAUNCH SCREEN -->
        <div class="screen-wrapper">
            <div class="screen-label">LAUNCH</div>
            <div class="phone-frame">
                <div class="launch-screen">
                    <div class="launch-logo">
                        <span class="launch-logo-text">owlet</span>
                    </div>
                    <div class="launch-buttons">
                        <button class="primary-button">Create Account</button>
                        <button class="white-button">Login</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOGIN SCREEN -->
        <div class="screen-wrapper">
            <div class="screen-label">LOGIN</div>
            <div class="phone-frame">
                <div class="login-screen">
                    <div class="title-container">
                        <h2 class="title">Login</h2>
                        <p class="subtitle">Welcome back.</p>
                    </div>

                    <div class="form-container">
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" placeholder="Username">
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" placeholder="Password">
                        </div>
                    </div>

                    <div class="link-container">
                        <span class="link">Forgot Password?</span>
                    </div>

                    <div class="button-container">
                        <button class="primary-button">Login</button>
                    </div>

                    <p class="or-text-center">or login with</p>
                </div>
            </div>
        </div>

        <!-- SIGNUP SCREEN -->
        <div class="screen-wrapper">
            <div class="screen-label">SIGNUP</div>
            <div class="phone-frame">
                <div class="signup-screen">
                    <div class="title-container">
                        <h2 class="title">Create Account</h2>
                        <p class="subtitle">Fill your information below.</p>
                    </div>

                    <div class="form-container" style="gap: 14px;">
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" placeholder="Username">
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" placeholder="Email">
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" placeholder="Password">
                        </div>
                        <div class="input-group">
                            <label>Confirm Password</label>
                            <input type="password" placeholder="Confirm Password">
                        </div>
                    </div>

                    <div class="button-container" style="margin-top: 20px;">
                        <button class="primary-button">Create Account</button>
                    </div>

                    <div class="or-container">
                        <div class="or-line"></div>
                        <span class="or-text">or</span>
                        <div class="or-line"></div>
                    </div>

                    <button class="google-button">
                        <svg class="google-icon" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="google-text">Continue with Google</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
